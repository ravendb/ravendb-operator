name: Sync DockerHub description

# Keeps the ravendb/ravendb-operator DockerHub overview (full + short description)
# in sync with DOCKERHUB.md. Runs when DOCKERHUB.md changes on main, or on demand
# from the Actions tab (use the manual run to populate DockerHub the first time).
on:
  push:
    branches: [main]
    paths:
      - DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push overview to DockerHub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ravendb/ravendb-operator
          short-description: "Kubernetes operator that deploys and manages secure RavenDB clusters from a RavenDBCluster CR."
          readme-filepath: ./DOCKERHUB.md
