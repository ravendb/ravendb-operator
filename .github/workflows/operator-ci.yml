name: CI 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 10 * * 1" # every Monday at 10:00 UTC

jobs:
  unit: 
    name: API types & Webhooks unit tests (envtest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTESTSUM_VERSION: "v1.12.3"
      K8S_VER: "1.29.5"
      ENVTEST_VERSION: "v0.0.0-20250308055145-5fe7bb3edc86"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache gotestsum binary
        id: cache-gts
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gotestsum
          key: ${{ runner.os }}-gotestsum-${{ hashFiles('go.mod') }}-${{ env.GOTESTSUM_VERSION }}

      - name: Install gotestsum (if cache miss)
        if: steps.cache-gts.outputs.cache-hit != 'true'
        run: go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"
      
      - name: Install setup-envtest tool
        run: go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@${ENVTEST_VERSION}"

      - name: Cache envtest assets
        id: cache-envtest
        uses: actions/cache@v4
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: ${{ runner.os }}-envtest-${{ env.K8S_VER }}

      - name: Select envtest Kubernetes assets
        run: echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path "${K8S_VER}")" >> "$GITHUB_ENV"

      - name: Cache Go build and module download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-gobuild-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-gobuild-

      - name: Run API & resource unit tests (gotestsum)
        run: ~/go/bin/gotestsum --format=short-verbose ./api/v1 ./pkg/...

  helm-operator:
    name: Helm (operator chart)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint + template (operator chart)
        env:
          CHART: ./helm/chart
          RELEASE: ravendb-operator
        shell: bash
        run: |
          set -euo pipefail
          common_args=(
            --namespace ravendb-operator-system
            --set controllerManager.image.repository=ravendb/ravendb-operator
            --set controllerManager.image.tag="ci-${GITHUB_SHA}"
          )

          helm lint "${CHART}" "${common_args[@]}" --strict

          helm template "${RELEASE}" "${CHART}" "${common_args[@]}" \
            > /tmp/operator-rendered.yaml

          echo "Asserting operator chart renders no Secret resources..."
          if grep -E "^kind: Secret$" /tmp/operator-rendered.yaml; then
            echo "FAIL: operator chart owns no cluster-side Secrets (those live in the cluster chart)" >&2
            exit 1
          fi

          echo "Asserting core operator resources are rendered..."
          for kind in Deployment CustomResourceDefinition MutatingWebhookConfiguration ValidatingWebhookConfiguration ClusterRole ClusterRoleBinding ServiceAccount; do
            if ! grep -q "^kind: ${kind}$" /tmp/operator-rendered.yaml; then
              echo "FAIL: missing required kind ${kind}" >&2
              exit 1
            fi
          done

  helm-cluster:
    name: Helm (cluster chart)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      RAVEN_LICENSE: ${{ secrets.RAVEN_LICENSE }}
      ADMIN_PFX_B64: ${{ secrets.ADMIN_PFX_B64 }}
      A_PFX_B64: ${{ secrets.A_PFX_B64 }}
      B_PFX_B64: ${{ secrets.B_PFX_B64 }}
      C_PFX_B64: ${{ secrets.C_PFX_B64 }}
      D_PFX_B64: ${{ secrets.D_PFX_B64 }}
      E_PFX_B64: ${{ secrets.E_PFX_B64 }}
      F_PFX_B64: ${{ secrets.F_PFX_B64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secrets setup
        uses: ./.github/actions/secrets-setup

      - uses: azure/setup-helm@v4

      - name: Helm lint (cluster chart)
        env:
          CHART: ./helm/cluster-chart
          VALUES: ./.github/helm-ci-values/cluster-chart.yaml
        shell: bash
        run: |
          set -euo pipefail
          helm lint "${CHART}" \
            --namespace ravendb \
            -f "${VALUES}" \
            --set-file secrets.license.file="${E2E_LICENSE_PATH}" \
            --set-file secrets.clientCert.file="${E2E_CLIENT_PFX_PATH}" \
            --set-file secrets.nodeCerts.files.a="${E2E_NODE_A_PFX_PATH}" \
            --set-file secrets.nodeCerts.files.b="${E2E_NODE_B_PFX_PATH}" \
            --set-file secrets.nodeCerts.files.c="${E2E_NODE_C_PFX_PATH}" \
            --strict

      - name: Helm template (cluster chart -- LE provisioning)
        env:
          CHART: ./helm/cluster-chart
          RELEASE: my-cluster
          VALUES: ./.github/helm-ci-values/cluster-chart.yaml
        shell: bash
        run: |
          set -euo pipefail
          helm template "${RELEASE}" "${CHART}" \
            --namespace ravendb \
            -f "${VALUES}" \
            --set-file secrets.license.file="${E2E_LICENSE_PATH}" \
            --set-file secrets.clientCert.file="${E2E_CLIENT_PFX_PATH}" \
            --set-file secrets.nodeCerts.files.a="${E2E_NODE_A_PFX_PATH}" \
            --set-file secrets.nodeCerts.files.b="${E2E_NODE_B_PFX_PATH}" \
            --set-file secrets.nodeCerts.files.c="${E2E_NODE_C_PFX_PATH}" \
            > /tmp/cluster-le-prov.yaml

          grep -q "^kind: RavenDBCluster$" /tmp/cluster-le-prov.yaml \
            || { echo "FAIL [LE provisioning]: missing RavenDBCluster" >&2; exit 1; }

          secret_count=$(grep -c "^kind: Secret$" /tmp/cluster-le-prov.yaml || true)
          if [[ "${secret_count}" != "5" ]]; then
            echo "FAIL [LE provisioning]: expected 5 Secrets (license + clientCert + 3x nodeCerts), got ${secret_count}" >&2
            exit 1
          fi

          if grep -q "^kind: IngressRouteTCP$" /tmp/cluster-le-prov.yaml; then
            echo "FAIL [LE provisioning]: IngressRouteTCP rendered without Traefik external access" >&2
            exit 1
          fi

      - name: Helm template (cluster chart -- LE BYO)
        env:
          CHART: ./helm/cluster-chart
          RELEASE: my-cluster
          VALUES: ./.github/helm-ci-values/cluster-chart.yaml
        shell: bash
        run: |
          set -euo pipefail
          helm template "${RELEASE}" "${CHART}" \
            --namespace ravendb \
            -f "${VALUES}" \
            > /tmp/cluster-le-byo.yaml

          grep -q "^kind: RavenDBCluster$" /tmp/cluster-le-byo.yaml \
            || { echo "FAIL [LE BYO]: missing RavenDBCluster" >&2; exit 1; }

          secret_count=$(grep -c "^kind: Secret$" /tmp/cluster-le-byo.yaml || true)
          if [[ "${secret_count}" != "0" ]]; then
            echo "FAIL [LE BYO]: expected 0 Secrets, got ${secret_count}" >&2
            exit 1
          fi

      - name: Helm template (cluster chart -- LE + Traefik)
        env:
          CHART: ./helm/cluster-chart
          RELEASE: my-cluster
          VALUES: ./.github/helm-ci-values/cluster-chart.yaml
        shell: bash
        run: |
          set -euo pipefail
          helm template "${RELEASE}" "${CHART}" \
            --namespace ravendb \
            -f "${VALUES}" \
            --set spec.externalAccessConfiguration.type=ingress-controller \
            --set spec.externalAccessConfiguration.ingressControllerContext.ingressClassName=traefik \
            --set-file secrets.license.file="${E2E_LICENSE_PATH}" \
            --set-file secrets.clientCert.file="${E2E_CLIENT_PFX_PATH}" \
            --set-file secrets.nodeCerts.files.a="${E2E_NODE_A_PFX_PATH}" \
            --set-file secrets.nodeCerts.files.b="${E2E_NODE_B_PFX_PATH}" \
            --set-file secrets.nodeCerts.files.c="${E2E_NODE_C_PFX_PATH}" \
            > /tmp/cluster-traefik.yaml

          grep -q "^kind: RavenDBCluster$" /tmp/cluster-traefik.yaml \
            || { echo "FAIL [Traefik]: missing RavenDBCluster" >&2; exit 1; }

          route_count=$(grep -c "^kind: IngressRouteTCP$" /tmp/cluster-traefik.yaml || true)
          if [[ "${route_count}" != "6" ]]; then
            echo "FAIL [Traefik]: expected 6 IngressRouteTCP (3 nodes x HTTPS + TCP), got ${route_count}" >&2
            exit 1
          fi

  e2e-helm:
    name: E2E Helm (kind)
    runs-on: ubuntu-latest
    needs: [unit, helm-operator, helm-cluster]
    timeout-minutes: 60
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      RAVEN_LICENSE: ${{ secrets.RAVEN_LICENSE }}
      ADMIN_PFX_B64: ${{ secrets.ADMIN_PFX_B64 }}
      A_PFX_B64: ${{ secrets.A_PFX_B64 }}
      B_PFX_B64: ${{ secrets.B_PFX_B64 }}
      C_PFX_B64: ${{ secrets.C_PFX_B64 }}
      D_PFX_B64: ${{ secrets.D_PFX_B64 }}
      E_PFX_B64: ${{ secrets.E_PFX_B64 }}
      F_PFX_B64: ${{ secrets.F_PFX_B64 }}  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Common E2E setup
        uses: ./.github/actions/common-setup

      - name: Secrets setup
        uses: ./.github/actions/secrets-setup

      - name: Run namespace E2E tests (HELM)
        env:
          RAVEN_E2E_INSTALL_MODE: helm
          RAVEN_E2E_HELM_CHART_PATH: ./helm/chart
          RAVEN_E2E_HELM_RELEASE: ravendb-operator
        run: go test -v -count=1 -timeout 10m ./test/e2e -run '^TestNamespace_'

      - name: Run health bootstrap E2E tests (HELM)
        env:
          RAVEN_E2E_INSTALL_MODE: helm
          RAVEN_E2E_HELM_CHART_PATH: ./helm/chart
          RAVEN_E2E_HELM_RELEASE: ravendb-operator
        run: go test -v -count=1 -timeout 10m ./test/e2e -run '^TestBootstrap_'

      - name: Run cluster chart E2E tests (nginx)
        env:
          RAVEN_E2E_INSTALL_MODE: helm
          RAVEN_E2E_HELM_CHART_PATH: ./helm/chart
          RAVEN_E2E_HELM_RELEASE: ravendb-operator
          RAVEN_E2E_INGRESS_CONTROLLER: nginx
        run: go test -v -count=1 -timeout 30m ./test/e2e -run '^TestClusterChart_(C1|C2|C4|C5|C6)_'

  e2e-helm-traefik:
    name: E2E Helm (kind, Traefik)
    runs-on: ubuntu-latest
    needs: [unit, helm-operator, helm-cluster]
    timeout-minutes: 30
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      RAVEN_LICENSE: ${{ secrets.RAVEN_LICENSE }}
      ADMIN_PFX_B64: ${{ secrets.ADMIN_PFX_B64 }}
      A_PFX_B64: ${{ secrets.A_PFX_B64 }}
      B_PFX_B64: ${{ secrets.B_PFX_B64 }}
      C_PFX_B64: ${{ secrets.C_PFX_B64 }}
      D_PFX_B64: ${{ secrets.D_PFX_B64 }}
      E_PFX_B64: ${{ secrets.E_PFX_B64 }}
      F_PFX_B64: ${{ secrets.F_PFX_B64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Common E2E setup
        uses: ./.github/actions/common-setup

      - name: Secrets setup
        uses: ./.github/actions/secrets-setup

      - name: Run cluster chart E2E test (Traefik)
        env:
          RAVEN_E2E_INSTALL_MODE: helm
          RAVEN_E2E_HELM_CHART_PATH: ./helm/chart
          RAVEN_E2E_HELM_RELEASE: ravendb-operator
          RAVEN_E2E_INGRESS_CONTROLLER: traefik
        run: go test -v -count=1 -timeout 20m ./test/e2e -run '^TestClusterChart_C3_'

  e2e-kustomize:
    name: E2E Kustomize (kind)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 60
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      RAVEN_LICENSE: ${{ secrets.RAVEN_LICENSE }}
      ADMIN_PFX_B64: ${{ secrets.ADMIN_PFX_B64 }}
      A_PFX_B64: ${{ secrets.A_PFX_B64 }}
      B_PFX_B64: ${{ secrets.B_PFX_B64 }}
      C_PFX_B64: ${{ secrets.C_PFX_B64 }}
      D_PFX_B64: ${{ secrets.D_PFX_B64 }}
      E_PFX_B64: ${{ secrets.E_PFX_B64 }}
      F_PFX_B64: ${{ secrets.F_PFX_B64 }} 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Common E2E setup
        uses: ./.github/actions/common-setup

      - name: Secrets setup
        uses: ./.github/actions/secrets-setup

      - name: Run health nodes E2E tests
        run: go test -v -count=1 -timeout 20m ./test/e2e -run '^TestNodes_'

      - name: Run health bootstrap E2E tests
        run: go test -v -count=1 -timeout 10m ./test/e2e -run '^TestBootstrap_'

      - name: Run health external access E2E tests
        run: go test -v -count=1 -timeout 10m ./test/e2e -run '^TestExternal_'

      - name: Run health license E2E tests
        run: go test -v -count=1 -timeout 10m ./test/e2e -run '^TestLicense_'

      - name: Run health storage E2E tests
        run: go test -v -count=1 -timeout 10m ./test/e2e -run '^TestStorage_'
      
      - name: Run namespace E2E tests
        run: go test -v -count=1 -timeout 10m ./test/e2e -run '^TestNamespace_'

  e2e-rolling-upgrade: 
    name: E2E RU (kind, kustomize)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 60
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      RAVEN_LICENSE: ${{ secrets.RAVEN_LICENSE }}
      ADMIN_PFX_B64: ${{ secrets.ADMIN_PFX_B64 }}
      A_PFX_B64: ${{ secrets.A_PFX_B64 }}
      B_PFX_B64: ${{ secrets.B_PFX_B64 }}
      C_PFX_B64: ${{ secrets.C_PFX_B64 }}
      D_PFX_B64: ${{ secrets.D_PFX_B64 }}
      E_PFX_B64: ${{ secrets.E_PFX_B64 }}
      F_PFX_B64: ${{ secrets.F_PFX_B64 }} 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Common E2E setup
        uses: ./.github/actions/common-setup

      - name: Secrets setup
        uses: ./.github/actions/secrets-setup

      - name: Run rolling upgrade happy secnario E2E test
        run: go test -v -count=1 -timeout 10m ./test/e2e -run TestUpgrade_62_71_happy_E2E

      - name: Run rolling upgrade cluster gate fail on A because B is down E2E test
        run: go test -v -count=1 -timeout 10m ./test/e2e -run TestUpgrade_62_71_pre_cluster_conn_fail_on_a_bc_b_down_E2E

      - name: Run rolling upgrade B can't be upgraded because A,C are down DB [A,B,C] test
        run: go test -v -count=1 -timeout 10m ./test/e2e -run TestUpgrade_62_71_degraded_db_placement_on_a_c_E2E
