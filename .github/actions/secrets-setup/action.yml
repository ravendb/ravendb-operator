name: secrets-setup
description: Secrets setup
runs:
  using: "composite"
  steps:
  - name: Validate required secrets
    shell: bash
    run: |
      # Cluster certificates are generated fresh per run (see the generate step
      # below), so only the license is a required secret now.
      required=(RAVEN_LICENSE)

      for k in "${required[@]}"; do
        if [ -z "${!k:-}" ]; then
          echo "ERROR: Missing required secret: $k"
          exit 1
        fi
      done

  - name: Resolve absolute E2E paths
    shell: bash
    run: |
      set -euo pipefail
      E2E_BASE="$HOME/ravendb-operator-e2e"
      echo "E2E_BASE=$E2E_BASE" >> "$GITHUB_ENV"
      echo "E2E_LICENSE_PATH=$E2E_BASE/license.json" >> "$GITHUB_ENV"
      echo "E2E_CLIENT_PFX_PATH=$E2E_BASE/admin.client.certificate.ravendb-operator-e2e.pfx" >> "$GITHUB_ENV"
      echo "E2E_NODE_A_PFX_PATH=$E2E_BASE/A/cluster.server.certificate.ravendb-operator-e2e.pfx" >> "$GITHUB_ENV"
      echo "E2E_NODE_B_PFX_PATH=$E2E_BASE/B/cluster.server.certificate.ravendb-operator-e2e.pfx" >> "$GITHUB_ENV"
      echo "E2E_NODE_C_PFX_PATH=$E2E_BASE/C/cluster.server.certificate.ravendb-operator-e2e.pfx" >> "$GITHUB_ENV"
      echo "E2E_NODE_D_PFX_PATH=$E2E_BASE/D/cluster.server.certificate.ravendb-operator-e2e.pfx" >> "$GITHUB_ENV"
      echo "E2E_NODE_E_PFX_PATH=$E2E_BASE/E/cluster.server.certificate.ravendb-operator-e2e.pfx" >> "$GITHUB_ENV"
      echo "E2E_NODE_F_PFX_PATH=$E2E_BASE/F/cluster.server.certificate.ravendb-operator-e2e.pfx" >> "$GITHUB_ENV"
    
  - name: Materialize license to file
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p "$E2E_BASE"
      printf '%s' "$RAVEN_LICENSE" > "$E2E_LICENSE_PATH"
      chmod 600 "$E2E_LICENSE_PATH"

  - name: Generate cluster certificates
    shell: bash
    run: |
      set -euo pipefail
      # Certs are generated fresh each run instead of shipped as fixed
      # *_PFX_B64 secrets. Those were bounded-validity fixtures: when they
      # expired the whole suite broke on unchanged code (RavenDB cannot derive
      # its admin client cert from an expired server cert). See hack script.
      bash "${GITHUB_WORKSPACE}/hack/gen-e2e-certs.sh"
