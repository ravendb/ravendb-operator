---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-ravendb-ravendb-io-v1-ravendbcluster
  failurePolicy: Fail
  name: mravendbcluster.kb.io
  rules:
  - apiGroups:
    - ravendb.ravendb.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - ravendbclusters
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-ravendb-ravendb-io-v1-ravendbcluster
  failurePolicy: Fail
  name: vravendbcluster.kb.io
  rules:
  - apiGroups:
    - ravendb.ravendb.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - ravendbclusters
  sideEffects: None
