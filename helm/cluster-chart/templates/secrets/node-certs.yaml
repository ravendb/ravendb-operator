{{- $files := .Values.secrets.nodeCerts.files | default dict }}
{{- if gt (len $files) 0 }}
{{- if ne .Values.spec.mode "LetsEncrypt" }}
{{- fail "secrets.nodeCerts.files can only be used when spec.mode=LetsEncrypt" }}
{{- end }}
{{- $prefix := required "secrets.nodeCerts.namePrefix is required when provisioning per-node certs" .Values.secrets.nodeCerts.namePrefix }}
{{- $nodeTags := dict }}
{{- range .Values.spec.nodes }}
{{- $_ := set $nodeTags (.tag | lower) true }}
{{- end }}
{{- range $tag, $content := $files }}
{{- $tagLower := $tag | lower }}
{{- if not (hasKey $nodeTags $tagLower) }}
{{- fail (printf "secrets.nodeCerts.files.%s does not match any spec.nodes[].tag" $tag) }}
{{- end }}
{{- if $content }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $prefix }}-{{ $tagLower }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ravendb-cluster.labels" $ | nindent 4 }}
type: Opaque
data:
  server.pfx: {{ $content | b64enc }}
---
{{- end }}
{{- end }}
{{- end }}
