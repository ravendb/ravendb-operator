# ==============================================================================
# RavenDB Operator - Helm Chart Values
#
# This chart installs the RavenDB Kubernetes Operator (controller, CRDs, RBAC,
# webhooks). Workload-side resources -- the RavenDBCluster CR and its license/
# certificate Secrets -- are owned by the separate ravendb-cluster chart.
# ==============================================================================

controllerManager:
  # Image for the operator controller.
  image:
    repository: ravendb/ravendb-operator
    tag: "" # Empty -> deployment template falls through to .Chart.AppVersion.

  # Number of controller replicas.
  replicaCount: 1

  # Optional pod resource requests/limits for the controller.
  # resources:
  #   requests:
  #     cpu: 10m
  #     memory: 64Mi
  #   limits:
  #     cpu: 500m
  #     memory: 128Mi

